doc: |
  ===============
  ANUCLIM indices
  ===============

  The ANUCLIM (v6.1) software package BIOCLIM sub-module produces a set of bioclimatic parameters derived values of
  temperature and precipitation. The methods in this module are wrappers around a subset of corresponding methods of
  :py:mod:`xclim.compute`.

  Furthermore, according to the ANUCLIM user-guide :cite:p:`xu_anuclim_2010`, input values should be at a weekly or
  monthly frequency.  However, the implementation here expands these definitions and can calculate the result with daily
  input data.
base: ResamplingIndicator
realm: atmos
references: ANUCLIM https://fennerschool.anu.edu.au/files/anuclim61.pdf (ch. 6)
indicators:
  P10_MeanTempWarmestQuarter:
    allowed_periods:
    - Y
    compute: tg_mean_warmcold_quarter
    outputs:
    - attrs:
        cell_methods: 'time: mean'
        standard_name: air_temperature
      units: K
    parameters:
      op: warmest
    src_freq:
    - D
    - 7D
    - MS
  P11_MeanTempColdestQuarter:
    allowed_periods:
    - Y
    compute: tg_mean_warmcold_quarter
    outputs:
    - attrs:
        cell_methods: 'time: mean'
        standard_name: air_temperature
      units: K
    parameters:
      op: coldest
    src_freq:
    - D
    - 7D
    - MS
  P12_AnnualPrecip:
    allowed_periods:
    - Y
    compute: prcptot
    context: hydro
    outputs:
    - attrs:
        cell_methods: 'time: sum'
        long_name: Annual Precipitation
        standard_name: lwe_thickness_of_precipitation_amount
      units: mm
    src_freq:
    - D
    - 7D
    - MS
  P13_PrecipWettestPeriod:
    allowed_periods:
    - Y
    compute: prcptot_wetdry_period
    context: hydro
    outputs:
    - attrs:
        cell_methods: 'time: sum'
        standard_name: lwe_thickness_of_precipitation_amount
      units: mm
    parameters:
      op: wettest
    src_freq:
    - D
    - 7D
    - MS
  P14_PrecipDriestPeriod:
    allowed_periods:
    - Y
    compute: prcptot_wetdry_period
    context: hydro
    outputs:
    - attrs:
        cell_methods: 'time: sum'
        standard_name: lwe_thickness_of_precipitation_amount
      units: mm
    parameters:
      op: driest
    src_freq:
    - D
    - 7D
    - MS
  P15_PrecipSeasonality:
    allowed_periods:
    - Y
    compute: precip_seasonality
    outputs:
    - attrs:
        cell_methods: 'time: standard_deviation'
        description: The standard deviation of the precipitation estimates expressed
          as a percentage of the mean of those estimates.
    src_freq:
    - D
    - 7D
    - MS
  P16_PrecipWettestQuarter:
    allowed_periods:
    - Y
    compute: prcptot_wetdry_quarter
    outputs:
    - attrs:
        cell_methods: 'time: sum'
        standard_name: lwe_thickness_of_precipitation_amount
      units: mm
    parameters:
      op: wettest
    src_freq:
    - D
    - 7D
    - MS
  P17_PrecipDriestQuarter:
    allowed_periods:
    - Y
    compute: prcptot_wetdry_quarter
    outputs:
    - attrs:
        cell_methods: 'time: sum'
        standard_name: lwe_thickness_of_precipitation_amount
      units: mm
    parameters:
      op: driest
    src_freq:
    - D
    - 7D
    - MS
  P18_PrecipWarmestQuarter:
    allowed_periods:
    - Y
    compute: prcptot_warmcold_quarter
    outputs:
    - attrs:
        cell_methods: 'time: sum'
        standard_name: lwe_thickness_of_precipitation_amount
      units: mm
    parameters:
      op: warmest
    src_freq:
    - D
    - 7D
    - MS
  P19_PrecipColdestQuarter:
    allowed_periods:
    - Y
    compute: prcptot_warmcold_quarter
    outputs:
    - attrs:
        cell_methods: 'time: sum'
        standard_name: lwe_thickness_of_precipitation_amount
      units: mm
    parameters:
      op: coldest
    src_freq:
    - D
    - 7D
    - MS
  P1_AnnMeanTemp:
    allowed_periods:
    - Y
    compute: statistics
    input:
      data: tas
    outputs:
    - attrs:
        cell_methods: 'time: mean'
        long_name: Annual Mean Temperature
        standard_name: air_temperature
      units: K
    parameters:
      freq:
        default: YS
      out_units: null
      statistic: mean
    src_freq:
    - D
    - 7D
    - MS
  P2_MeanDiurnalRange:
    allowed_periods:
    - Y
    compute: difference_statistics
    input:
      data1: tasmin
      data2: tasmax
    outputs:
    - attrs:
        cell_methods: 'time: range'
        long_name: Mean Diurnal Range
      units: K
    parameters:
      absolute: false
      freq:
        default: YS
      statistic: mean
    src_freq:
    - D
    - 7D
    - MS
  P3_Isothermality:
    allowed_periods:
    - Y
    compute: isothermality
    outputs:
    - attrs:
        cell_methods: 'time: range'
        description: The mean diurnal range (P2) divided by the Annual Temperature
          Range (P7).
    src_freq:
    - D
    - 7D
    - MS
  P4_TempSeasonality:
    allowed_periods:
    - Y
    compute: temperature_seasonality
    outputs:
    - attrs:
        cell_methods: 'time: standard_deviation'
        description: The standard deviation of the mean temperatures expressed as
          a percentage of the mean of those temperatures. For this calculation, the
          mean in degrees Kelvin is used. This avoids the possibility of having to
          divide by zero, but it does mean that the values are usually quite small.
    src_freq:
    - D
    - 7D
    - MS
  P5_MaxTempWarmestPeriod:
    allowed_periods:
    - Y
    compute: statistics
    input:
      data: tasmax
    outputs:
    - attrs:
        cell_methods: 'time: maximum'
        description: The highest maximum temperature in all periods of the year.
        long_name: Max Temperature of Warmest Period
        standard_name: air_temperature
      units: K
    parameters:
      freq:
        default: YS
      out_units: null
      statistic: max
    src_freq:
    - D
    - 7D
    - MS
  P6_MinTempColdestPeriod:
    allowed_periods:
    - Y
    compute: statistics
    input:
      data: tasmin
    outputs:
    - attrs:
        cell_methods: 'time: minimum'
        description: The lowest minimum temperature in all periods of the year.
        long_name: Min Temperature of Coldest Period
        standard_name: air_temperature
      units: K
    parameters:
      freq:
        default: YS
      out_units: null
      statistic: min
    src_freq:
    - D
    - 7D
    - MS
  P7_TempAnnualRange:
    allowed_periods:
    - Y
    compute: extreme_range
    input:
      data1: tasmin
      data2: tasmax
    outputs:
    - attrs:
        cell_methods: 'time: range'
        long_name: Temperature Annual Range
      units: K
    parameters:
      freq:
        default: YS
    src_freq:
    - D
    - 7D
    - MS
  P8_MeanTempWettestQuarter:
    allowed_periods:
    - Y
    compute: tg_mean_wetdry_quarter
    outputs:
    - attrs:
        cell_methods: 'time: mean'
        standard_name: air_temperature
      units: K
    parameters:
      op: wettest
    src_freq:
    - D
    - 7D
    - MS
  P9_MeanTempDriestQuarter:
    allowed_periods:
    - Y
    compute: tg_mean_wetdry_quarter
    outputs:
    - attrs:
        cell_methods: 'time: mean'
        standard_name: air_temperature
      units: K
    parameters:
      op: driest
    src_freq:
    - D
    - 7D
    - MS
